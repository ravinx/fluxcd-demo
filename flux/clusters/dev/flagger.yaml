---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: flagger
  namespace: flux-system
spec:
  dependsOn:
    - name: helm-repositories-flagger
    - name: namespaces
  interval: 10m0s
  path: ./flux/infrastructure/infra-apps/flagger
  prune: true
  sourceRef:
    kind: GitRepository
    name: dev
  force: true
