---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: helm-repositories-opentelemetry
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/infrastructure/sources/opentelemetry
  prune: true
  sourceRef:
    kind: GitRepository
    name: master2
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/infrastructure/sources/grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: master2
  wait: true