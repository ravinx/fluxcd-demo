---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
  namespace: strimzi
spec:
  interval: 5m
  values:
    operationTimeoutMs: 900000
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 20m
        memory: 384Mi
    watchNamespaces:
      - kafka
  chart:
    spec:
      version: "0.45.1"
      chart: strimzi-kafka-operator
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
      interval: 5m
