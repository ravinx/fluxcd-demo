apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: dev
  labels:
    app.kubernetes.io/name: kafka
spec:
  kafka:
    template:
      pod:
        terminationGracePeriodSeconds: 300
    resources:
      requests:
        memory: "512Mi"
        cpu: "1"
      limits:
        memory: "1Gi"
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      max.replicas.per.broker: 20
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
      log.roll.hours: 24
    livenessProbe:
      initialDelaySeconds: 60
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 10Gi
          deleteClaim: false
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

  zookeeper:
    resources:
      requests:
        memory: "512Mi"
        cpu: "50m"
      limits:
        memory: "1Gi"
    replicas: 1
    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: false
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: zookeeper-metrics-config.yml
  # We want to avoid the operator accidentally deleting topics in envs, so we prefer creating them by other means.
  # Check https://strimzi.io/docs/operators/0.28.0/full/configuring#ref-kafka-entity-operator-str for how to configure this.
  # entityOperator:
  #   topicOperator: {}
  #   userOperator: {}
  cruiseControl:
    config:
      cpu.capacity.threshold: 0.9
    brokerCapacity:
      inboundNetwork: 1GiB/s
      outboundNetwork: 1GiB/s
    resources:
      requests:
        memory: "512Mi"
        cpu: "20m"
      limits:
        memory: "1Gi"
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: cruise-control-metrics
          key: metrics-config.yml

  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    logging: debug
    enableSaramaLogging: true
    resources:
      requests:
        memory: "100Mi"
        cpu: "500m"
      limits:
        memory: "512Mi"
