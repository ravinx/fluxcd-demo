---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-k8s-cluster-metrics-collector
rules:
  - apiGroups:
      - ''
    resources:
      - events
      - namespaces
      - namespaces/status
      - nodes
      - nodes/proxy
      - nodes/spec
      - nodes/stats
      - nodes/metrics
      - services
      - endpoints
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - pods
      - pods/status
      - secrets
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "monitoring.coreos.com"
    resources:
      - servicemonitors
      - podmonitors
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - extensions
    resources:
      - ingresses
      - daemonsets
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "discovery.k8s.io"
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-k8s-cluster-metrics-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-k8s-cluster-metrics-collector
subjects:
  - kind: ServiceAccount
    # quirk of the Operator
    name: otel-k8s-cluster-metrics-collector
    namespace: monitoring
  - kind: ServiceAccount
    name: otel-k8s-cluster-metrics-targetallocator
    namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-k8s-cluster-metrics-collector
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-k8s-cluster-metrics-targetallocator
  namespace: monitoring

