---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: user-kube-prometheus
spec:
  interval: 5m
  values:
    global:
      rbac:
        createAggregateClusterRoles: true
    metrics:
      enabled: true
    prometheus:
      prometheusSpec:
        enableRemoteWriteReceiver: true
        enableFeatures:
          - exemplar-storage
        podMonitorSelector:
          matchLabels:
            app: strimzi
        retention: 1h
        resources:
          requests:
            cpu: "0.08"
            memory: "200Mi"
          limits:
            cpu: "1"
            memory: "500Mi"
        ruleSelector:
          matchLabels:
            prometheus: k8s
            role: alert-rules
        securityContext:
          fsGroup: 2000
          runAsNonRoot: true
          runAsUser: 1000
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
    grafana:
      enabled: true
  chart:
    spec:
      version: "54.2.1"
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
